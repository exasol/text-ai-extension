# Generated and maintained by the exasol-toolbox.
name: Publish Documentation

on:
  workflow_call:
  workflow_dispatch:

jobs:

  build-documentation:
    runs-on: "ubuntu-26.04"
    permissions:
      contents: read
    steps:
      - name: Check out Repository
        id: check-out-repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free Disk Space
        id: free-disk-space
        uses: $/.github/actions/free-diskspace
      - name: Set up Python & Poetry Environment
        id: set-up-python-and-poetry-environment
        uses: exasol/python-toolbox/.github/actions/python-environment@v12
        with:
          python-version: "3.11"
          poetry-version: "2.3.0"

      - name: Build Documentation
        id: build-documentation
        run: |
          poetry run -- nox -s docs:multiversion
          mv .html-documentation html-documentation

      - name: Upload Artifact
        id: upload-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: html-documentation
