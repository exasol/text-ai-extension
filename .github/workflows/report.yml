# Generated and maintained by the exasol-toolbox.
name: Status Report

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

jobs:

  report:
    runs-on: "ubuntu-26.04"
    permissions:
      contents: read
    steps:
      - name: Check out Repository
        id: check-out-repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free Disk Space
        id: free-disk-space
        uses: $/.github/actions/free-diskspace
      - name: Set up Python & Poetry Environment
        id: set-up-python-and-poetry-environment
        uses: exasol/python-toolbox/.github/actions/python-environment@v12
        with:
          python-version: "3.11"
          poetry-version: "2.3.0"

      - name: Download Artifacts
        id: download-artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Copy Artifacts into Root Folder
        id: copy-artifacts-into-root-folder
        run: poetry run -- nox -s artifacts:copy -- artifacts

      - name: Validate Artifacts
        id: validate-artifacts
        run: poetry run -- nox -s artifacts:validate

      - name: Sonar is NOT activated for the project
        id: sonar-not-active
        run: |
          echo "Check out https://exasol.github.io/python-toolbox/main/user_guide/features/metrics/sonar.html for more details"
