workflows:
  - name: fast-tests
    step_customizations:
      - action: INSERT_AFTER
        job: run-unit-tests
        step_id: check-out-repository
        content:
          - name: Free Disk Space
            id: free-disk-space
            uses: $/.github/actions/free-diskspace

      - action: REPLACE
        job: run-unit-tests
        step_id: run-unit-tests
        content:
          - name: Run Unit Tests
            id: run-unit-tests
            run: poetry run -- nox -s test:unit -- test/integration/no_db --coverage

